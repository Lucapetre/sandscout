name: CI

on:
  push:
    branches: [ master, main, ahmad, luca/add-main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up GHC and Cabal
      uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.10.3'
        cabal-version: 'latest'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cabal/store
          dist-newstyle
        key: ${{ runner.os }}-cabal-${{ hashFiles('**/*.cabal') }}
        restore-keys: |
          ${{ runner.os }}-cabal-

    - name: Build project
      run: cabal build all

    - name: Run test suite
      run: cabal test all
